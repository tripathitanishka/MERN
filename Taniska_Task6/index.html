<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Services Login</title>

    <!-- IMPORTANT: CSS filename must be exactly index.css -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left-section">

            <div class="laundry-image">

                <div class="books">
                    <div class="book blue-book"></div>
                    <div class="book yellow-book"></div>
                    <div class="book orange-book"></div>
                </div>

                <div class="bottle">
                    <div class="bottle-cap"></div>
                </div>

                <div class="washing-machine">

                    <div class="machine-top">
                        <div class="round-button"></div>
                        <div class="round-button"></div>
                        <div class="long-button"></div>
                    </div>

                    <div class="machine-body">

                        <div class="door">
                            <div class="door-inner"></div>
                        </div>

                        <div class="small-button"></div>

                    </div>

                </div>

                <div class="laundry-basket">
                    <div class="basket-clothes"></div>
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-section">

            <div class="login-box">

                <h1>Hello Again!</h1>

                <p class="welcome">
                    Welcome back! we missed you!
                </p>

                <form>

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Emailid@site.com"
                    >


                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                    >


                    <div class="forgot-password">
                        <a href="#">Forgot Password</a>
                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <p class="register">
                    Not a member?
                    <a href="#">Register Now</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
